<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo | Catálogo Express B2B</title>
    
    <!-- Tipografía -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { warning: '#f59e0b', dark: '#0f172a' } }
                }
            }
        }
    </script>
    <style>
        /* Ocultar flechas del input number */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type=number] { -moz-appearance: textfield; }
        
        .sticky-header { position: sticky; top: 0; z-index: 40; backdrop-filter: blur(8px); background-color: rgba(255, 255, 255, 0.95); border-bottom: 1px solid #e2e8f0; }
        .cart-open { transform: translateX(0%); }
        .cart-closed { transform: translateX(100%); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased pb-24">

    <!-- Header / Buscador -->
    <header class="sticky-header px-4 py-3 shadow-sm">
        <div class="max-w-5xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3 w-full sm:w-auto">
                <div class="bg-brand-warning text-white p-2 rounded-lg font-bold">B2B</div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Distribuidora Demo</h1>
                    <p class="text-xs text-slate-500">Lista de Precios Mayorista</p>
                </div>
            </div>
            
            <div class="w-full sm:w-96 relative">
                <input type="text" id="searchInput" placeholder="Buscar por código o descripción..." class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-brand-warning focus:ring-1 focus:ring-brand-warning text-sm">
                <svg class="w-5 h-5 absolute left-3 top-2.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
        </div>
    </header>

    <!-- Lista de Productos B2B -->
    <main class="max-w-5xl mx-auto px-4 py-6">
        
        <!-- Encabezados de Tabla (Visible en Desktop) -->
        <div class="hidden md:grid grid-cols-12 gap-4 px-4 py-2 text-xs font-bold text-slate-500 uppercase tracking-wider mb-2 border-b border-slate-200">
            <div class="col-span-2">Código</div>
            <div class="col-span-4">Descripción</div>
            <div class="col-span-2 text-right">Precio x Kg</div>
            <div class="col-span-2 text-right">Bulto Cerrado</div>
            <div class="col-span-2 text-center">Pedir (Bultos)</div>
        </div>

        <!-- Contenedor Dinámico -->
        <div id="productList" class="flex flex-col gap-3">
            <!-- Los productos se inyectan acá vía JS -->
        </div>

    </main>

    <!-- Barra Flotante Carrito -->
    <div class="fixed bottom-0 left-0 w-full bg-brand-dark text-white p-4 shadow-2xl z-50">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <div>
                <p class="text-xs text-slate-400">Total Estimado</p>
                <p class="text-xl font-bold" id="cartTotalUI">$0.00</p>
            </div>
            <button onclick="toggleCart()" class="bg-brand-warning text-brand-dark font-bold px-6 py-2 rounded-lg flex items-center gap-2 hover:bg-yellow-400 transition">
                <span>Ver Pedido</span>
                <span id="cartCountBadge" class="bg-white text-brand-dark px-2 py-0.5 rounded-full text-xs">0</span>
            </button>
        </div>
    </div>

    <!-- Modal Carrito Lateral -->
    <div id="cartSidebar" class="fixed inset-y-0 right-0 w-full md:w-96 bg-white shadow-2xl z-[60] cart-closed transition-transform duration-300 flex flex-col border-l border-slate-200">
        <div class="px-4 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
            <h2 class="font-bold text-lg">Tu Pedido</h2>
            <button onclick="toggleCart()" class="p-2 text-slate-500 hover:text-slate-800 rounded-full hover:bg-slate-200">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        
        <div id="cartItemsContainer" class="flex-1 overflow-y-auto p-4 flex flex-col gap-4">
            <!-- Items del carrito -->
        </div>
        
        <div class="p-4 border-t border-slate-200 bg-slate-50">
            <div class="flex justify-between items-center mb-4 font-bold text-lg">
                <span>Total:</span>
                <span id="cartFinalTotal">$0.00</span>
            </div>
            <button onclick="enviarWhatsApp()" class="w-full bg-green-500 text-white font-bold py-3 rounded-lg hover:bg-green-600 transition flex justify-center items-center gap-2">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
                Enviar Pedido
            </button>
        </div>
    </div>

    <!-- Overlay oscuro para Sidebar -->
    <div id="overlay" onclick="toggleCart()" class="fixed inset-0 bg-black bg-opacity-50 z-[55] hidden"></div>

    <script>
        // DATOS DE DEMO: Fuerte enfoque en el cálculo Kilo -> Bulto
        const products = [
            { id: '1001', sku: 'AL-PER-20', name: 'Alimento Perro Adulto Standard', priceKg: 1250, boxKg: 20 },
            { id: '1002', sku: 'AL-PUP-15', name: 'Alimento Cachorro Premium', priceKg: 2100, boxKg: 15 },
            { id: '1003', sku: 'AL-GAT-10', name: 'Alimento Gato Castrado', priceKg: 2800, boxKg: 10 },
            { id: '1004', sku: 'PD-SAN-25', name: 'Piedras Sanitarias Aglutinantes', priceKg: 450, boxKg: 25 },
            { id: '1005', sku: 'HI-SHA-05', name: 'Shampoo Hipoalergénico Bidón', priceKg: 3500, boxKg: 5 },
            { id: '1006', sku: 'SN-HUE-50', name: 'Huesos de Cuero (Pack x 50u)', priceKg: 8500, boxKg: 1, isUnit: true },
            { id: '1007', sku: 'AL-PER-15', name: 'Alimento Perro Senior', priceKg: 1800, boxKg: 15 },
            { id: '1008', sku: 'PD-SIL-03', name: 'Sílica Gel para Gatos', priceKg: 3200, boxKg: 3 }
        ];

        let cart = {};

        const formatMoney = (amount) => {
            return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' }).format(amount);
        };

        // Renderizado optimizado para velocidad masiva
        const renderProducts = (filter = '') => {
            const container = document.getElementById('productList');
            container.innerHTML = '';
            
            const filtered = products.filter(p => 
                p.name.toLowerCase().includes(filter.toLowerCase()) || 
                p.sku.toLowerCase().includes(filter.toLowerCase())
            );

            filtered.forEach(p => {
                const bultoPrice = p.priceKg * p.boxKg;
                const qty = cart[p.id]?.qty || 0;
                
                const card = document.createElement('div');
                card.className = "bg-white p-4 rounded-xl shadow-sm border border-slate-200 md:grid md:grid-cols-12 items-center gap-4 hover:border-brand-warning transition";
                card.innerHTML = `
                    <div class="col-span-2 text-xs text-slate-500 font-mono mb-1 md:mb-0">${p.sku}</div>
                    <div class="col-span-4 font-bold text-sm md:text-base mb-2 md:mb-0">${p.name}</div>
                    
                    <div class="col-span-2 flex justify-between md:block md:text-right text-sm">
                        <span class="md:hidden text-slate-500">x Kilo/Unidad:</span>
                        <span class="text-slate-600">${formatMoney(p.priceKg)} ${p.isUnit ? 'c/u' : 'x Kg'}</span>
                    </div>
                    
                    <div class="col-span-2 flex justify-between md:block md:text-right mb-3 md:mb-0">
                        <span class="md:hidden text-slate-500">Bulto (${p.boxKg}${p.isUnit ? 'u' : 'kg'}):</span>
                        <span class="font-bold text-brand-dark">${formatMoney(bultoPrice)}</span>
                    </div>
                    
                    <div class="col-span-2 flex items-center justify-end md:justify-center gap-2">
                        <button onclick="updateCart('${p.id}', -1)" class="w-8 h-8 flex items-center justify-center bg-slate-100 rounded hover:bg-slate-200 text-slate-600 font-bold">-</button>
                        <input type="number" id="input-${p.id}" value="${qty}" class="w-12 h-8 text-center border border-slate-300 rounded font-bold text-sm focus:outline-none" readonly>
                        <button onclick="updateCart('${p.id}', 1)" class="w-8 h-8 flex items-center justify-center bg-slate-100 rounded hover:bg-slate-200 text-slate-600 font-bold">+</button>
                    </div>
                `;
                container.appendChild(card);
            });
        };

        const updateCart = (id, change) => {
            if (!cart[id]) {
                const product = products.find(p => p.id === id);
                cart[id] = { ...product, qty: 0 };
            }
            
            cart[id].qty += change;
            
            if (cart[id].qty <= 0) {
                delete cart[id];
                document.getElementById(`input-${id}`).value = 0;
            } else {
                document.getElementById(`input-${id}`).value = cart[id].qty;
            }
            
            updateCartUI();
        };

        const updateCartUI = () => {
            const container = document.getElementById('cartItemsContainer');
            container.innerHTML = '';
            
            let total = 0;
            let count = 0;

            Object.values(cart).forEach(item => {
                const itemTotal = (item.priceKg * item.boxKg) * item.qty;
                total += itemTotal;
                count += item.qty;

                container.innerHTML += `
                    <div class="border-b border-slate-100 pb-3">
                        <div class="text-sm font-bold truncate">${item.name}</div>
                        <div class="flex justify-between items-end mt-1">
                            <div class="text-xs text-slate-500">${item.qty} bultos x ${formatMoney(item.priceKg * item.boxKg)}</div>
                            <div class="font-bold">${formatMoney(itemTotal)}</div>
                        </div>
                    </div>
                `;
            });

            if (count === 0) {
                container.innerHTML = '<div class="text-slate-400 text-center py-10 text-sm">Tu pedido está vacío.</div>';
            }

            document.getElementById('cartTotalUI').innerText = formatMoney(total);
            document.getElementById('cartFinalTotal').innerText = formatMoney(total);
            document.getElementById('cartCountBadge').innerText = count;
        };

        const toggleCart = () => {
            const sidebar = document.getElementById('cartSidebar');
            const overlay = document.getElementById('overlay');
            
            if (sidebar.classList.contains('cart-closed')) {
                sidebar.classList.remove('cart-closed');
                overlay.classList.remove('hidden');
            } else {
                sidebar.classList.add('cart-closed');
                overlay.classList.add('hidden');
            }
        };

        const enviarWhatsApp = () => {
            if (Object.keys(cart).length === 0) {
                alert("Agregá productos al pedido primero.");
                return;
            }

            let mensaje = "Hola, te envío mi pedido mayorista:%0A%0A";
            let total = 0;

            Object.values(cart).forEach(item => {
                const subtotal = (item.priceKg * item.boxKg) * item.qty;
                total += subtotal;
                mensaje += `▪ ${item.qty}x bulto/s - ${item.sku} - ${item.name} (%24${(item.priceKg * item.boxKg).toFixed(2)})%0A`;
            });

            mensaje += `%0A*TOTAL ESTIMADO: ${formatMoney(total)}*%0A%0AGenerado desde Catálogo Express.`;
            
            // Reemplazar con el número real de demo (el tuyo)
            const numero = "5491121586674"; 
            window.open(`https://wa.me/${numero}?text=${mensaje}`, '_blank');
        };

        // Eventos
        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderProducts(e.target.value);
        });

        // Init
        renderProducts();
        updateCartUI();
    </script>
</body>
</html>
